name: Validate data

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Validate every match
        run: uvx scadustats@latest match validate
      - name: Validate the squares reference
        if: ${{ !cancelled() }}
        run: uvx scadustats@latest square validate
