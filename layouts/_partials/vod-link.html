{{- /* Input: a VOD URL (may be empty: renders nothing). A "Watch VOD" pill
       with an external-link icon, opening the video in a new tab. Lists
       render it beside the row/card link, never inside it (no nested <a>). */ -}}
{{- with . -}}
<a class="pill pill-sm pill-accent vod-link" href="{{ . }}" target="_blank" rel="noopener" aria-label="Watch VOD (opens in a new tab)"><span class="vod-label">Watch VOD</span> <svg class="icon-external" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg></a>
{{- end -}}
