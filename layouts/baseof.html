<!DOCTYPE html>
<html lang="{{ or site.Language.Locale site.Language.Lang }}" data-theme="dark" data-spoilers="hidden">
<head>
    {{ partial "head.html" . }}
</head>
<body>
    {{ partial "header.html" . }}
    {{- /* A full-width strip under the header; the home page uses it for the
           under-construction notice. */}}
    {{ block "banner" . }}{{ end }}

    <div class="main-wrapper">
        <div class="container">
            {{ block "main" . }}{{ end }}
        </div>
    </div>

    {{ partial "footer.html" . }}
</body>
</html>
