{{ define "main" }}
{{ partial "breadcrumb.html" . }}
<div class="content-grid">
  <main>
    <h1>{{ .Title }}</h1>
    {{- with .Content }}<div class="article-body">{{ . }}</div>{{ end }}
    {{ partial "calendar.html" (dict) }}
  </main>

  <div id="persistent-sidebar" data-turbo-permanent>
    {{ partial "sidebar.html" . }}
  </div>
</div>
{{ end }}
