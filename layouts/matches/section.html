{{ define "main" }}
{{ partial "breadcrumb.html" . }}
<div class="content-grid">
  <main>
    <h1>{{ .Title }}</h1>
    {{- with .Content }}<div class="article-body">{{ . }}</div>{{ end }}

    <ul class="match-history">
      {{- range sort (where site.RegularPages "Section" "matches") "Date" "desc" }}
        {{ partial "match-row.html" . }}
      {{- end }}
    </ul>
  </main>

  <div id="persistent-sidebar" data-turbo-permanent>
    {{ partial "sidebar.html" . }}
  </div>
</div>
{{ end }}
