[[menus.main]]
  name = "Seasons"
  pageRef = "/seasons"
  weight = 30

[[menus.main]]
  name = "Squares"
  pageRef = "/squares"
  weight = 40

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 50
