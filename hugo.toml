baseURL = "https://scadustats.com/"
locale = "en-us"
title = "Scadustats"

# No tags or categories: pages come from data/, not from front matter.
[taxonomies]

[params]
  subtitle = "Scadustats | Bingo Brawlers"
  description = "Community-base repository for match history, player records, and square stats for the Elden Ring Bingo Brawlers league, transcribed from the VODs."
  repo = "https://github.com/adri0/scadustats-site"
  # Read by the Land of Shadow theme (github.com/adri0/land-of-shadow).
  homeTitle = "Bingo Brawlers · Scadustats | Bingo Brawlers"
  logo = "images/logo.png"
  wordmark = "images/bingo-brawlers.png"
  wordmarkAlt = "Bingo Brawlers"
  disclaimer = "This project is a fan initiative, built out of appreciation for Bingo Brawlers and Elden Ring. Its only purpose is to provide more insights into the tournement. It is not affiliated with or endorsed by Bingo Brawlers, FromSoftware, or Bandai Namco."
  # Attributes on <html>. Results stay hidden until head-end.html's script
  # (or the visitor) says otherwise.
  [params.htmlAttributes]
    data-spoilers = "hidden"

[module]
  [[module.imports]]
    path = "github.com/adri0/land-of-shadow"

