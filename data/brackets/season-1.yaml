# Hand-curated playoff bracket for season 1 (1v1, base game), videos 29-38.
# See data/brackets/season-6.yaml for the field reference.
#
# Single elimination between the round robin's top four, every match a best of
# three: semi-finals 2nd vs 3rd and 1st vs 4th, then the Final between the
# winners and a third-place match between the losers (`bracket: third`, which
# decides 3rd and 4th). `loser_next` draws the semi-final losers' drop to the
# third-place match. Dates are the archive's (CDT).
#
# None of the playoffs is transcribed yet, so each match gives `red`/`blue`
# and `red_score`/`blue_score` by hand, from the archived bingobrawlers.com
# Season 1 page. Once a match's VODs are transcribed, replace those four
# fields with `match: <file name under data/matches/season-1/, without
# .json>` (e.g. `match: 2023-04-22-star0chris-vs-LilAggy`): players, scores
# and the winner are then read from the match file, and the match leaves the
# round-robin grid. The match files will say `double_elimination`: scadustats
# has no match type for single elimination.
title: Playoffs
phase: Single elimination
matches:
  - { id: 1, label: Semi-final 1, bracket: semifinal, col: 0, row: 0, date: "2023-04-22", next: 3, loser_next: 4, red: LilAggy, blue: star0chris, red_score: 1, blue_score: 2 }
  - { id: 2, label: Semi-final 2, bracket: semifinal, col: 0, row: 1, date: "2023-04-29", next: 3, loser_next: 4, red: GinoMachino, blue: Ainrun, red_score: 2, blue_score: 0 }
  - { id: 3, label: Final, bracket: final, col: 1, row: 0.5, date: "2023-05-06", red: star0chris, blue: GinoMachino, red_score: 0, blue_score: 2 }
  - { id: 4, label: 3rd place, bracket: third, col: 1, row: 1.75, date: "2023-04-30", red: LilAggy, blue: Ainrun, red_score: 2, blue_score: 0 }
