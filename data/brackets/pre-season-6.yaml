# Hand-curated bracket for pre-season 6, the US Qualifiers (six players,
# videos 161-169). See data/brackets/season-6.yaml for the field reference.
#
# - Play-offs (`bracket: playoffs`): three matches drawn at random. Winners go
#   to the upper bracket and losers drop to the lower bracket.
# - Upper bracket: the play-off winner with the best score (most game wins,
#   then fewest game losses) goes straight to the Upper Final; the other two
#   play Match 5. Losing in the upper bracket drops a player to the lower
#   bracket.
# - Lower bracket: losing eliminates a player. The Lower Final is the lower
#   bracket's last match, against the Upper Final's loser.
# - There is no Grand Final. The winners of the Upper and Lower Finals qualify
#   for Season 6 (`qualifies`, shown beside the winner).
#
# `next` is where a match's winner went and `loser_next` where its loser
# dropped to; both draw connectors on the diagram, from the player's row. Match
# 6 sits under Match 5 so that Match 5's loser drops straight down to it, and
# `lane` keeps the lines into column 1's three matches apart.
title: Play-offs and double elimination
matches:
