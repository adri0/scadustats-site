# Hand-curated bracket for pre-season 6 (six players). Rendered as an SVG
# diagram on the season page by _partials/season-bracket.html; see
# data/brackets/season-6.yaml for the field reference. `bracket: playoffs` is
# a section of its own, drawn above the upper bracket.
#
# Matches follow the VOD playlist (videos 161-169):
# - Play-offs (161-163): the three losers go to the lower bracket.
# - Upper bracket: of the three play-off winners, the two with the fewest
#   points play each other (165); the winner meets the one with the most
#   points in the Grand Final (168), and the loser drops to the lower bracket.
# - Lower bracket (164, 166, 167), ending in the Lower Final (169) against the
#   Grand Final's loser, which decides third place.
# Play-off winners are seeded by points, so play-off matches have no `next`.
# Matches without a transcribed VOD list their players only; scores and
# winners appear once the match file exists (set `match:`) or scores are
# entered by hand.
